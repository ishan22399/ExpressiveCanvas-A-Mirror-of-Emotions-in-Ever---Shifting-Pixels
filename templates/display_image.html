<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview - ExpressiveCanvas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: float-particle 8s infinite linear;
        }

        @keyframes float-particle {
            from {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            to {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-brand {
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .nav-brand:hover {
            transform: scale(1.05);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 2rem;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-links a:hover {
            color: #f39c12;
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
        }

        /* Main Content */
        .main-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 3rem 2rem;
            animation: fadeInUp 0.8s ease-out;
        }

        .page-title {
            text-align: center;
            color: white;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 3rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: slideInDown 0.8s ease-out;
        }

        .image-preview-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 3rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
            animation: scaleIn 0.8s ease-out 0.3s both;
        }

        .image-preview-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, rgba(52, 152, 219, 0.1), transparent, rgba(155, 89, 182, 0.1));
            animation: rotate 10s linear infinite;
            z-index: -1;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        .preview-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .preview-title {
            color: #2c3e50;
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .preview-subtitle {
            color: #7f8c8d;
            font-size: 1rem;
            font-weight: 400;
        }

        /* Image Container */
        .image-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 3rem;
            perspective: 1000px;
        }

        .image-container {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .image-container:hover {
            transform: rotateY(5deg) rotateX(2deg) scale(1.02);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        }

        .preview-image {
            max-width: 100%;
            max-height: 500px;
            height: auto;
            display: block;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        /* Image overlay */
        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(52, 152, 219, 0.1), rgba(155, 89, 182, 0.1));
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 20px;
        }

        .image-container:hover .image-overlay {
            opacity: 1;
        }

        /* Image info */
        .image-info {
            background: rgba(52, 152, 219, 0.1);
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            border-left: 4px solid #3498db;
            animation: slideInLeft 0.8s ease-out 0.6s both;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .info-item {
            display: flex;
            align-items: center;
            color: #2c3e50;
        }

        .info-item i {
            margin-right: 0.5rem;
            color: #3498db;
            font-size: 1.1rem;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            animation: slideInUp 0.8s ease-out 0.9s both;
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 30px rgba(52, 152, 219, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(45deg, #95a5a6, #7f8c8d);
            color: white;
            animation: slideInUp 0.8s ease-out 1.1s both;
        }

        .btn-secondary:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 30px rgba(149, 165, 166, 0.4);
        }

        /* Loading states */
        .btn.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .btn.loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-container {
                padding: 2rem 1rem;
            }
            
            .image-preview-container {
                padding: 2rem;
            }
            
            .page-title {
                font-size: 2rem;
            }
            
            .action-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
            }
            
            .nav-content {
                flex-direction: column;
                gap: 1rem;
            }
        }

        /* Success pulse animation */
        .success-pulse {
            animation: pulse-success 2s ease-in-out;
        }

        @keyframes pulse-success {
            0% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(39, 174, 96, 0); }
            100% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0); }
        }
    </style>
</head>
<body>
    <!-- Animated Particles -->
    <div class="particles" id="particles"></div>

    <!-- Header -->
    <header class="header">
        <div class="nav-content">
            <a href="/" class="nav-brand">
                <i class="fas fa-palette"></i> ExpressiveCanvas
            </a>
            <nav class="nav-links">
                <a href="/"><i class="fas fa-home"></i> Home</a>
                <a href="#" onclick="window.history.back()"><i class="fas fa-arrow-left"></i> Back</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <div class="main-container">
        <h1 class="page-title">
            <i class="fas fa-image"></i> Image Preview
        </h1>

        <div class="image-preview-container">
            <div class="preview-header">
                <h2 class="preview-title">Your Uploaded Image</h2>
                <p class="preview-subtitle">Ready to transform into expressive art</p>
            </div>

            <div class="image-wrapper">
                <div class="image-container" id="imageContainer">
                    <img src="/uploads/{{ filename }}" alt="Uploaded Image" class="preview-image" id="previewImage">
                    <div class="image-overlay"></div>
                </div>
            </div>

            <div class="image-info">
                <div class="info-grid">
                    <div class="info-item">
                        <i class="fas fa-file-image"></i>
                        <span>Image loaded successfully</span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-check-circle"></i>
                        <span>Ready for processing</span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-magic"></i>
                        <span>AI-powered transformation</span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-clock"></i>
                        <span>Real-time emotion detection</span>
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <a href="/manipulate/{{ filename }}" class="btn btn-primary" id="startBtn">
                    <i class="fas fa-play"></i> Start Expressing!
                </a>
                <a href="/" class="btn btn-secondary">
                    <i class="fas fa-upload"></i> Upload Another
                </a>
            </div>
        </div>
    </div>

    <script>
        // Create animated particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 20;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Image load handling
        function handleImageLoad() {
            const image = document.getElementById('previewImage');
            const container = document.getElementById('imageContainer');
            
            image.onload = function() {
                container.classList.add('success-pulse');
                console.log('Image loaded successfully');
            };
            
            image.onerror = function() {
                console.error('Failed to load image');
                // You could add error handling here
            };
        }

        // Button click effects
        function setupButtonEffects() {
            const startBtn = document.getElementById('startBtn');
            
            startBtn.addEventListener('click', function(e) {
                this.classList.add('loading');
                this.innerHTML = '<i class="fas fa-spinner"></i> Preparing...';
                
                // Add a small delay for visual feedback
                setTimeout(() => {
                    window.location.href = this.href;
                }, 500);
                
                e.preventDefault();
            });
        }

        // Parallax effect for image
        function setupParallax() {
            document.addEventListener('mousemove', (e) => {
                const image = document.querySelector('.preview-image');
                const container = document.querySelector('.image-container');
                
                if (image && container) {
                    const rect = container.getBoundingClientRect();
                    const x = (e.clientX - rect.left - rect.width / 2) / rect.width;
                    const y = (e.clientY - rect.top - rect.height / 2) / rect.height;
                    
                    container.style.transform = `perspective(1000px) rotateY(${x * 10}deg) rotateX(${-y * 10}deg) scale(1.02)`;
                }
            });
            
            document.addEventListener('mouseleave', () => {
                const container = document.querySelector('.image-container');
                if (container) {
                    container.style.transform = 'perspective(1000px) rotateY(0deg) rotateX(0deg) scale(1)';
                }
            });
        }

        // Initialize everything
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            handleImageLoad();
            setupButtonEffects();
            setupParallax();
        });

        // Header scroll effect
        window.addEventListener('scroll', () => {
            const header = document.querySelector('.header');
            if (window.scrollY > 50) {
                header.style.background = 'rgba(255, 255, 255, 0.15)';
            } else {
                header.style.background = 'rgba(255, 255, 255, 0.1)';
            }
        });
    </script>
</body>
</html>
